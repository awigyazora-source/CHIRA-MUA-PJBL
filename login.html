<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chira Make Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fde9e6;
            height: 100vh;
            overflow: hidden; 
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* BAGIAN FOTO KIRI */
        .photo-section {
            width: 42%;
            height: 100vh;
            overflow: hidden;
            border-radius: 0 18px 18px 0;
        }

        .photo-section img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
        }

        /* BAGIAN FORM KANAN */
        .form-section {
            width: 58%;
            height: 100vh;
            /* Menggunakan clamp agar padding mengecil jika layar pendek */
            padding: clamp(20px, 4vh, 35px) 40px clamp(15px, 2vh, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            
            /* Safety net: Hanya form kanan yang bisa scroll internal jika layar sangat kecil, tanpa memunculkan scrollbar */
            overflow-y: auto;
            scrollbar-width: none; /* Untuk Firefox */
        }
        
        .form-section::-webkit-scrollbar {
            display: none; /* Untuk Chrome, Safari, Edge */
        }

        /* LOGO */
        .logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: clamp(5px, 1vh, 15px);
        }

        .logo img {
            /* Ukuran logo otomatis menyesuaikan tinggi layar */
            max-width: clamp(220px, 25vh, 300px); 
            width: 60%;
            height: auto;
        }

        /* FORM LOGIN */
        .login-form {
            width: 100%;
            max-width: 380px;
            /* Margin atas bawah fleksibel */
            margin: clamp(15px, 3vh, 25px) 0; 
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            height: clamp(42px, 6vh, 47px); /* Tinggi input fleksibel */
            padding: 0 14px;
            margin-bottom: clamp(10px, 2vh, 14px);
            border: 1px solid #f2c8c3;
            border-radius: 15px;
            background-color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-form input:focus {
            border-color: #987a7a;
        }

        .login-options {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin: 0 12px clamp(15px, 2vh, 18px);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            white-space: nowrap;
            color: #443333;
        }

        .remember input {
            width: 18px;
            height: 18px;
            accent-color: #927676;
            cursor: pointer;
        }

        /* PEMISAH / DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: clamp(14px, 2.5vh, 18px) 0;
            color: #8c7878;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ebd4cf;
        }

        .divider span {
            padding: 0 12px;
        }

        /* TOMBOL GOOGLE MODERN */
        .google-btn {
            width: 100%;
            height: clamp(42px, 5.5vh, 46px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #ffffff;
            color: #332222;
            border: 1px solid #ebd4cf;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease;
        }

        .google-btn:hover {
            background-color: #fff9f9;
            border-color: #d89a9a;
            box-shadow: 0 4px 12px rgba(158, 107, 107, 0.15);
            transform: translateY(-1px);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* TOMBOL LOGIN */
        .login-button {
            display: block;
            width: 68%;
            min-width: 180px;
            height: clamp(40px, 5vh, 43px);
            margin: 0 auto;
            border: none;
            border-radius: 25px;
            background-color: #927979;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 3px #00000020;
            transition: 0.2s;
        }

        .login-button:hover {
            background-color: #785f5f;
            transform: translateY(-1px);
        }

        /* BAGIAN BAWAH */
        .bottom-section {
            text-align: center;
            color: #999999;
            line-height: 1.5; /* Dikurangi dari 1.7 agar lebih hemat tempat */
            margin-top: clamp(10px, 2vh, 20px);
            margin-bottom: 5px;
        }

        .bottom-section a {
            color: #999999;
            text-decoration: none;
        }

        .bottom-section a:hover {
            color: #785f5f;
            text-decoration: underline;
        }

        .copyright {
            font-size: 12px;
            color: #222222;
            margin-top: 5px;
        }

        /* RESPONSIVE UNTUK HP */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow-y: auto;
            }

            .login-container {
                flex-direction: column;
                height: auto;
            }

            .photo-section {
                width: 100%;
                height: 35vh;
                border-radius: 0 0 18px 18px;
            }

            .form-section {
                width: 100%;
                height: auto;
                min-height: 65vh;
                padding: 20px 24px 40px;
                overflow-y: visible; /* Kembalikan normal di HP */
            }

            .logo img {
                width: 50%;
                max-width: 200px;
            }

            .login-form {
                margin: 30px 0;
            }

            .bottom-section {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- FOTO PENGANTIN DI SEBELAH KIRI -->
        <div class="photo-section">
            <img src="img/FOTO-LOGIN.jpg" alt="Foto pengantin Chira Make Up">
        </div>

        <!-- FORM LOGIN DI SEBELAH KANAN -->
        <main class="form-section">

            <!-- LOGO CHIRA MAKE UP -->
            <header class="logo"> 
                <img src="img/CHIRA_LOGO-removebg-preview.png" alt="Chira Make Up Logo">
            </header>

            <!-- FORMULIR LOGIN -->
            <form class="login-form" id="loginForm">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email:"
                    aria-label="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password:"
                    aria-label="Password"
                    required
                >

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        <span>Remember Me</span>
                    </label>
                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

                <!-- PEMISAH & TOMBOL SOSIAL MODERN -->
                <div class="divider">
                    <span>atau</span>
                </div>

                <button type="button" class="google-btn" id="googleLoginBtn">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Masuk dengan Google</span>
                </button>

            </form>

            <!-- REGISTER DAN ADMIN -->
            <footer class="bottom-section">
                <p>
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

                <p>
                    <a href="admin-login.html">Login as Admin</a>
                </p>

                <p class="copyright">
                    Copyright © 2026 Chira MUA Malang All Rights Reserved.
                </p>
            </footer>

        </main>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Mencegah form reload halaman

            // 1. Simpan status login ke localStorage
            localStorage.setItem("chira_login_status", "true");

            // 2. Arahkan user ke halaman beranda
            window.location.href = "index.html";
        });

        // 3. Simulasi Login Cepat Akun Google
        const googleLoginBtn = document.getElementById("googleLoginBtn");
        if (googleLoginBtn) {
            googleLoginBtn.addEventListener("click", function() {
                localStorage.setItem("chira_login_status", "true");
                localStorage.setItem("chira_user_name", "Google Account (Demo)");
                window.location.href = "index.html";
            });
        }
    </script>

</body>
</html>
